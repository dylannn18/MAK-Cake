<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAK CAKE Logo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap');

        body {
            background: radial-gradient(circle at center, #b87333, #4b2e1a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logo-container {
            text-align: center;
            color: #d4af37;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.5);
        }
        .logo-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4em;
            background: linear-gradient(45deg, #e6c200, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
            margin: 0;
        }
        .logo-container .subtitle {
            font-family: 'Great Vibes', cursive;
            color: #e6c200;
            font-size: 1.5em;
            letter-spacing: 2px;
            margin-top: -10px;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.3);
        }
        .decorative {
            color: #d4af37;
            font-size: 2em;
            font-family: 'Great Vibes', cursive;
            margin: 10px 0;
        }
        .icon-cake {
            display: inline-block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #f5cc88, #e8a467);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            margin-bottom: 10px;
            border: 4px solid #d4af37;
        }
        .icon-cake::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: #ff4d4d;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.6);
        }
        .icon-cake::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: #fff;
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="icon-cake"></div>
        <h1>MAK CAKE</h1>
        <div class="decorative">❀ ❧ ❀</div>
        <div class="subtitle">Sweetness Redefined</div>
    </div>
    <script>
        console.log("Welcome to MAK CAKE!");
    </script>
</body>
</html>
