<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sweet Delights</title>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css');
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #0a1931, #1f4068);
            color: #fff;
        }
        .header {
            background: linear-gradient(to right, #162447, #1f4068);
            color: white;
            text-align: center;
            padding: 25px 0;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 25px;
            background: #162447;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .contact-form, .contact-info {
            width: 48%;
        }
        .contact-form h2, .contact-info h2 {
            color: #e43f5a;
            font-size: 22px;
            margin-bottom: 12px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-top: 12px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s, box-shadow 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #e43f5a;
            outline: none;
            box-shadow: 0 0 8px rgba(228, 63, 90, 0.5);
        }
        .btn {
            margin-top: 18px;
            padding: 12px;
            background: #e43f5a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background: #d63447;
            transform: scale(1.05);
        }
        .contact-info p {
            font-size: 15px;
            margin: 10px 0;
            color: #ddd;
            line-height: 1.5;
        }
        .contact-info i {
            color: #e43f5a;
            margin-right: 10px;
        }
        .social-icons {
            margin-top: 20px;
        }
        .social-icons a {
            margin-right: 12px;
            font-size: 18px;
            color: #e43f5a;
            transition: color 0.3s;
        }
        .social-icons a:hover {
            color: #d63447;
        }
        .map-container {
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 180px;
            border-radius: 8px;
        }
        .back-home {
            text-align: center;
            margin-top: 25px;
        }
        .back-home a {
            color: #e43f5a;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s;
        }
        .back-home a:hover {
            color: #d63447;
        }
    </style>
    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;
            if (name == "" || email == "" || message == "") {
                alert("Please fill out all fields.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <div class="header">Contact Us</div>
    <div class="container">
        <div class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="submit_contact.php" method="POST" onsubmit="return validateForm()">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
        <div class="contact-info">
            <h2>Our Contact Information</h2>
            <p><i class="fas fa-phone"></i><strong> Phone:</strong> +1 (234) 567-8900</p>
            <p><i class="fas fa-envelope"></i><strong> Email:</strong> support@sweetdelights.com</p>
            <p><i class="fas fa-map-marker-alt"></i><strong> Address:</strong> 123 Bakery Street, Sweet City, SC 45678</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="map-container">
                <iframe src="https://maps.google.com/maps?q=123+Bakery+Street,Sweet+City,SC+45678&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
            </div>
        </div>
    </div>
    <div class="back-home">
        <a href="index.html">← Back to Home Page</a>
    </div>
</body>
</html>
