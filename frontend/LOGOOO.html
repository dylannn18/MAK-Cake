<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAK Cake Shop Logo</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .logo-container {
      text-align: center;
    }

    /* Logo Text */
    .logo-text {
      font-family: 'Cursive', sans-serif;
      font-size: 70px;
      color: #d67e9f; /* Elegant pink */
      margin: 10px 0;
      letter-spacing: 1px;
      text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2);
    }

    .tagline {
      font-family: 'Arial', sans-serif;
      font-size: 20px;
      color: #c57d61; /* Soft brown */
      margin-top: -5px;
    }

    /* Cake Icon */
    .cake-icon {
      width: 150px;
      height: auto;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- SVG Cake Icon -->
    <svg class="cake-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#f4a261" stroke="#e76f51" stroke-width="3"/>
      <path d="M25,50 L75,50" stroke="#e76f51" stroke-width="2"/>
      <circle cx="50" cy="30" r="5" fill="#ff6347" />
      <circle cx="40" cy="35" r="4" fill="#ff6347" />
      <circle cx="60" cy="35" r="4" fill="#ff6347" />
      <rect x="35" y="50" width="30" height="20" fill="#f4a261"/>
    </svg>

    <!-- Logo Text -->
    <div class="logo-text">MAK</div>
    <div class="tagline">Cake Shop</div>
  </div>

</body>
</html>
