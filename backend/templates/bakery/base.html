<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MAK Cakes Backend{% endblock %}</title>
  <style>
    :root {
      --ink: #2a1c15;
      --soft: #6f5d4f;
      --paper: #fff8ef;
      --line: #ebdcc8;
      --dark: #211610;
      --gold: #efcb5a;
      --green: #0f766e;
      --red: #991b1b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f4efe8; color: var(--ink); }
    header { background: linear-gradient(120deg, #1a110d, #352318); color: #fef3df; padding: 14px 20px; border-bottom: 1px solid #5d422e; }
    .head-row { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: .03em; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    nav a, nav button.nav-link-btn { color: #fbe5b8; text-decoration: none; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(239, 203, 90, 0.24); font-size: .92rem; background: transparent; font: inherit; cursor: pointer; }
    nav a:hover, nav button.nav-link-btn:hover { background: rgba(239, 203, 90, 0.12); }
    nav form { margin: 0; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 16px 32px; }
    h1 { margin-top: 0; margin-bottom: 16px; font-size: 1.75rem; }
    h2 { margin-top: 24px; margin-bottom: 12px; font-size: 1.2rem; }
    .toolbar { margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 4px 12px rgba(20,10,5,0.06); }
    .card strong { display: block; color: var(--soft); margin-bottom: 6px; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
    table { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #f0e5d6; text-align: left; vertical-align: top; }
    th { background: #fcf4e8; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: #5f4b3e; }
    .badge { padding: 5px 10px; border-radius: 999px; background: #f8ecd7; border: 1px solid #e8d2af; font-size: 12px; display: inline-block; }
    .btn { display: inline-block; text-decoration: none; border: 0; cursor: pointer; border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
    .btn-dark { background: var(--dark); color: #fff8eb; }
    .btn-gold { background: var(--gold); color: #4c2f19; }
    .btn-ghost { background: #fff9f0; border: 1px solid #e7d8c0; color: #4f3a2c; }
    .btn + .btn { margin-left: 6px; }
    .flash-wrap { margin-bottom: 12px; display: grid; gap: 8px; }
    .flash { background: #ecfdf5; color: var(--green); border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 8px; }
    .flash.error { background: #fef2f2; color: var(--red); border-color: #fecaca; }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, select, textarea { width: 100%; background: #fffdf8; border: 1px solid #dbc8af; border-radius: 8px; padding: 8px 10px; font: inherit; color: #35251d; }
    textarea { min-height: 120px; resize: vertical; }
    .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field label { display: block; margin-bottom: 5px; font-size: .85rem; color: #614d3f; }
    .field.full { grid-column: 1 / -1; }
    .muted { color: var(--soft); font-size: .88rem; }
    .text-right { text-align: right; }
    @media (max-width: 820px) {
      .form-grid { grid-template-columns: 1fr; }
      nav { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <div class="brand">MAK Cakes Management</div>
      <nav>
        <a href="{% url 'bakery:dashboard' %}">Dashboard</a>
        <a href="{% url 'bakery:cake_menu' %}">Cake Menu</a>
        <a href="{% url 'bakery:order_list' %}">Orders</a>
        <a href="{% url 'bakery:sales_report' %}">Sales</a>
        <a href="{% url 'bakery:home' %}">Public Site</a>
        <a href="/admin/">Django Admin</a>
        {% if request.user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="nav-link-btn">Logout</button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% if messages %}
    <div class="flash-wrap">
      {% for message in messages %}
      <div class="flash{% if message.tags == 'error' %} error{% endif %}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
